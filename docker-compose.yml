version: '3.8'

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: natratax-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - natratax-network

  # Laravel 11 Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: natratax-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=NatraTax
      - APP_ENV=production
      - APP_KEY=base64:DEMO_SECRET_KEY_FOR_SMK_BINA_PUTRA_2026=
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=natratax_db
      - DB_USERNAME=natratax_user
      - DB_PASSWORD=SecretPassword2026!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - natratax-network

  # PostgreSQL Database (Multi-Tenant Ready)
  postgres:
    image: postgres:16-alpine
    container_name: natratax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: natratax_db
      POSTGRES_USER: natratax_user
      POSTGRES_PASSWORD: SecretPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - natratax-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: natratax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - natratax-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: natratax-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - natratax-network

networks:
  natratax-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
